"""
Login headless B2C via VTEX ID (rotas públicas `/api/vtexid/pub/...`).

IMPORTANTE: todas as operações são resolvidas server-side. O browser NUNCA fala
com o VTEX ID diretamente — quem repassa os cookies de autenticação é o resolver
`vtexIdAuth.ts`. Ver AGENTS.md do componente antes de alterar qualquer contrato.
"""

"Métodos de login habilitados na conta (Admin > Configurações da conta > Autenticação > Loja virtual)."
type VtexIdAuthMethods {
  "Login por e-mail + senha (`showClassicAuthentication`)."
  password: Boolean!
  "Login por código de acesso / passwordless (`showAccessKeyAuthentication`)."
  accessKey: Boolean!
  "Provedores OAuth habilitados (Google, Facebook). Apenas informativo."
  oauthProviders: [String!]!
}

"Resultado padrão de toda operação de autenticação."
type VtexIdAuthResult {
  "`true` somente quando a VTEX confirmou (`authStatus: Success`) e os cookies foram repassados."
  success: Boolean!
  "Código bruto devolvido pela VTEX (`authStatus` ou `code`). Use para lógica, nunca para exibir."
  errorCode: String
  "Mensagem pt-BR pronta para exibir ao usuário. Já mapeada em `vtexIdAuth.ts`."
  message: String
}

extend type Query {
  "Consulta quais métodos de login estão habilitados na conta. Use para renderizar a UI dinamicamente."
  vtexIdAuthMethods: VtexIdAuthMethods @cacheControl(scope: PRIVATE)
}

extend type Mutation {
  "Login com e-mail + senha. Em caso de sucesso, emite os cookies `VtexIdclientAutCookie*`."
  vtexIdLoginWithPassword(email: String!, password: String!): VtexIdAuthResult
    @cacheControl(scope: PRIVATE)

  """
  Envia o código de acesso de 6 dígitos para o e-mail.
  Guarda o `_vss` da sessão num cookie first-party — obrigatório para o passo seguinte.
  """
  vtexIdSendAccessKey(email: String!): VtexIdAuthResult
    @cacheControl(scope: PRIVATE)

  "Login passwordless: valida o código de acesso enviado por `vtexIdSendAccessKey`."
  vtexIdLoginWithAccessKey(email: String!, accessKey: String!): VtexIdAuthResult
    @cacheControl(scope: PRIVATE)

  """
  Define ou redefine a senha usando o código de acesso, e já autentica o usuário.
  Serve tanto para 1º acesso quanto para 'esqueci minha senha'.
  """
  vtexIdSetPassword(
    email: String!
    accessKey: String!
    newPassword: String!
  ): VtexIdAuthResult @cacheControl(scope: PRIVATE)
}
